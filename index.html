/* Deliberate, traceable opponent movements */
.bot-tools{display:flex;flex-wrap:wrap;gap:10px;align-items:stretch;justify-content:space-between;margin:9px 0 12px}
.bot-speed{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:12px;color:#e9efe2}
.bot-speed>span{font-weight:800;margin-inline-end:4px}
.speed-option{border:1px solid #ecce8b77;background:#163e35;color:#f8eedd;padding:7px 10px;font-weight:700;border-radius:9px;min-width:51px;font-size:12px}
.speed-option.selected{background:#e9c16c;color:#17372d;border-color:#ffebbc;box-shadow:0 0 0 1px #e9c16c}
.bot-action{flex:1;min-width:230px;display:flex;align-items:center;gap:8px;padding:9px 11px;border:1px solid #e6cb8770;border-radius:11px;background:#183f32;color:#eadcbb;font-size:13px;font-weight:700}
.bot-action.visible{background:#ead080;color:#17392f;border-color:#fff0b7;box-shadow:0 2px 12px #e9c16c44}
.bot-action-dot{display:inline-grid;place-items:center;width:25px;height:25px;flex:0 0 25px;background:#194734;color:#ffe6a1;border-radius:100%;font-size:17px}
.pile.bot-source{border:3px solid #9decef!important;background:#77e9e334!important;box-shadow:inset 0 0 0 2px #58e3ed60,0 0 0 3px #60c9cd50}
.pile.bot-target{border:3px solid #ffe68b!important;background:#ffc95e4b!important;box-shadow:inset 0 0 0 2px #ffce606b,0 0 0 4px #ffc86155;animation:bot-target-pulse 1s ease-in-out infinite alternate}
@keyframes bot-target-pulse{from{box-shadow:inset 0 0 0 2px #ffce606b,0 0 0 2px #ffc86130}to{box-shadow:inset 0 0 0 2px #ffce60a0,0 0 0 6px #ffc86155}}
.flying-card{position:fixed;z-index:100;pointer-events:none;filter:drop-shadow(0 8px 10px #001a1aaa)}
.flying-card .card{outline:3px solid #ffdb69;box-shadow:0 3px 26px #ffd36b99}
.flight-count{position:absolute;bottom:-14px;left:50%;transform:translateX(-50%);background:#f1d17e;color:#18372d;border-radius:15px;padding:3px 7px;white-space:nowrap;font-size:11px;font-weight:900}
@media(max-width:700px){.bot-tools{gap:7px;flex-direction:column}.bot-speed{justify-content:center}.bot-action{min-width:0;font-size:12px;padding:8px 10px}}
@media(prefers-reduced-motion:reduce){.pile.bot-target{animation:none}}


/* Large, legible real-world English-pattern deck v1.3 */
:root{--hand-card-w:94px;--hand-card-h:133px;--board-card-w:95px;--pile-height:190px}
#app{max-width:1340px}
.arena{padding:19px 16px}
.board{width:min(100%,1030px);grid-template-columns:repeat(3,minmax(0,1fr));grid-template-rows:repeat(3,var(--pile-height));gap:12px;align-items:stretch}
.pile-wrap{min-width:0;min-height:0;height:100%;position:relative}
.pile-wrap .pile{width:100%;height:100%;padding:3px}
.pile .stack{width:100%;height:100%;min-height:0;display:flex;align-items:center;justify-content:center;gap:10px;padding:30px 10px 24px;overflow:hidden}
.stack .stack-card{position:relative;top:auto;left:auto!important;transform:none;box-shadow:none;width:min(43%,var(--board-card-w));flex:0 1 auto;min-width:0}
.stack .card[data-kind="pile"]{width:100%;height:auto;aspect-ratio:2/3;border-radius:7px}
.stack-one .stack-card{width:min(58%,calc(var(--board-card-w) + 7px))}
.stack-count{bottom:6px;right:7px;background:#09221ce0;font-size:11px}
.stack-note{position:relative;left:auto;bottom:auto;display:block;transform:none;font-size:11px;line-height:1.2;margin:3px auto 0;padding:2px 3px;text-align:center;border-radius:7px;color:#fff5d3;background:#1c5546}
.stack-between{position:absolute;left:50%;bottom:5px;transform:translateX(-50%);white-space:nowrap;border:1px solid #ecd8a45c;background:#07372f;border-radius:8px;font-size:10px;color:#ffdf8b;padding:2px 4px}
.pile-label{font-size:12px;top:5px;left:7px}
.inspect-btn{position:absolute;z-index:15;right:7px;top:5px;background:#eed17e;color:#193b31;border:1px solid #fff5bb;border-radius:7px;font-size:18px;font-weight:bold;padding:2px 8px;line-height:1.2;box-shadow:0 1px 5px #0009}
.inspect-btn:active{transform:scale(.95)}
.card{width:var(--hand-card-w);height:var(--hand-card-h)}
.card .real-face{position:absolute;inset:0;z-index:3;width:100%;height:100%;object-fit:fill;display:block;background:transparent;border-radius:inherit;pointer-events:none;opacity:0;transition:opacity .15s ease}.card .real-face.loaded{opacity:1}
.card.back .real-face{display:none}
.center-deck{min-height:0}
.center-deck .card{width:var(--hand-card-w);height:var(--hand-card-h)}
.hand{min-height:160px;gap:9px;padding:12px 4px 8px;justify-content:safe center}
.hand-card{padding:0 0 11px}
.inspect-modal{width:min(96vw,1100px);max-height:92dvh}
.inspect-modal .tiny{line-height:1.8}
.inspect-sequence{display:flex;gap:16px;align-items:flex-start;overflow-x:auto;direction:ltr;scrollbar-width:thin;padding:18px 4px 23px;margin-bottom:12px;background:#07382f9c;border-radius:12px}
.inspect-item{display:flex;flex:0 0 auto;align-items:center;flex-direction:column;gap:8px;color:#ffe2a1;font-size:13px}
.inspect-item .card{width:140px;height:210px}
.inspect-item b{color:#fff;font-size:15px}
@media(max-width:700px){
:root{--hand-card-w:88px;--hand-card-h:124px;--board-card-w:81px;--pile-height:165px}
#app{padding:9px 7px 18px}
.arena{padding:8px}
.board{grid-template-columns:repeat(2,minmax(0,1fr));grid-template-areas:"deck deck" "c0 c2" "c1 c3" "c4 c6" "c5 c7";grid-template-rows:148px repeat(4,var(--pile-height));gap:9px}
.slot-0{grid-area:c0}.slot-1{grid-area:c1}.slot-2{grid-area:c2}.slot-3{grid-area:c3}.slot-4{grid-area:c4}.slot-5{grid-area:c5}.slot-6{grid-area:c6}.slot-7{grid-area:c7}.center-deck{grid-area:deck;gap:5px}
.pile-label{font-size:10px;left:4px;top:3px;padding:3px 5px}
.inspect-btn{right:4px;top:3px;padding:2px 6px;font-size:16px}
.pile .stack{gap:5px;padding:22px 4px 25px}
.stack .stack-card{width:min(45%,var(--board-card-w))}
.stack-one .stack-card{width:min(62%,92px)}
.stack-note{font-size:10px;margin-top:3px}
.stack-between{bottom:4px;left:42%;font-size:9px}
.stack-count{font-size:10px;bottom:4px;right:2px}
.hand{justify-content:flex-start;min-height:152px;gap:9px;scroll-snap-type:x proximity}
.hand-card{scroll-snap-align:start}
.inspect-modal{padding:15px;width:98vw}
.inspect-item .card{width:120px;height:180px}
.inspect-sequence{gap:10px}
}
@media(max-width:370px){:root{--hand-card-w:82px;--hand-card-h:116px;--board-card-w:66px;--pile-height:149px}.pile .stack{gap:4px;padding:22px 3px 25px}.hand{min-height:139px}}

.table-xl .board{width:min(100%,1270px);--pile-height:230px;--board-card-w:135px}
.table-xl .center-deck .card{width:110px;height:156px}

.table-xl .board{grid-template-columns:minmax(0,1fr);grid-template-areas:"deck" "c0" "c1" "c2" "c3" "c4" "c5" "c6" "c7";grid-template-rows:170px repeat(8,225px);--board-card-w:136px;gap:10px}

}


/* One-screen play mode: no vertical scrolling during the match */
html.game-screen,html.game-screen body{height:100%;overflow:hidden}
html.game-screen #app{height:100dvh;min-height:100dvh;display:flex;flex-direction:column;overflow:hidden;gap:4px;padding:8px 10px 8px}
html.game-screen .header{margin-bottom:2px}
html.game-screen .brand{font-size:clamp(17px,2vw,24px)}
html.game-screen .brand-logo{height:34px;width:34px;font-size:22px}
html.game-screen .header-actions{gap:5px}
html.game-screen .btn.sm{padding:6px 10px;font-size:12px}
html.game-screen .game-top{margin-bottom:2px}
html.game-screen .game-top h2{font-size:18px}

<div id="app"></div>
<script type="module">

// For a deployed shared game, replace null with Firebase's web config object.
// This configuration is public by design. Security is defined in Realtime Database Rules.
const SHARED_FIREBASE_CONFIG = null;
const FIREBASE_CDN = '13.3.0';
const $ = s => document.querySelector(s);
const appRoot = $('#app');
const SIDES = [1,3,4,6], CORNERS=[0,2,5,7];
const SUITS={H:'♥',D:'♦',C:'♣',S:'♠'};
const SUIT_NAMES={H:'قلوب',D:'ديناري',C:'سباتي',S:'بستوني'};
const RANKS={1:'A',11:'J',12:'Q',13:'K'};
const LOCAL_KEY='shayeb_corners_local_v1';
const ROUNDS_KEY='shayeb_match_rounds_v22';
const safeRounds=v=>{const n=Number(v);return Number.isInteger(n)&&n>=1&&n<=30?n:5};
const BOT_SPEED_KEY='shayeb_bot_speed_v2';
const BOT_LEVEL_KEY='shayeb_bot_level_v21';
const SOUND_KEY='shayeb_sound_enabled_v21';
const TABLE_VIEW_KEY='shayeb_table_view_v1';
const BOT_SPEED={slow:{flight:1550,hold:950},normal:{flight:850,hold:550},fast:{flight:300,hold:220}};
const PILE_NAMES=['الركن العلوي الأيسر','الموضع العلوي','الركن العلوي الأيمن','الموضع الأيسر','الموضع الأيمن','الركن السفلي الأيسر','الموضع السفلي','الركن السفلي الأيمن'];
let model={mode:'home',screen:'home',game:null,roomCode:'',uid:null,name:localStorage.getItem('shayeb-name')||'',bots:2,localPlayers:2,selected:null,hint:false,cover:false,dialog:null,notice:'',connected:false,busy:false,botSpeed:['slow','normal','fast'].includes(localStorage.getItem(BOT_SPEED_KEY))?localStorage.getItem(BOT_SPEED_KEY):'slow',botStep:null,inspectPile:null,gameMenuOpen:false,undoStack:[],actionBusy:false,botLevel:['easy','normal','pro'].includes(localStorage.getItem(BOT_LEVEL_KEY))?localStorage.getItem(BOT_LEVEL_KEY):'normal',soundOn:localStorage.getItem(SOUND_KEY)!=='off',matchRounds:safeRounds(localStorage.getItem(ROUNDS_KEY)),tableView:localStorage.getItem(TABLE_VIEW_KEY)==='xl'?'xl':'standard'};
let cloud=null,unsubscribe=null,botBusy=false,toastTimeout=null,botGeneration=0;
function escapeHTML(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
const rank=c=>Number(c.slice(0,-1));
const suit=c=>c.slice(-1);
const isRed=c=>['H','D'].includes(suit(c));
const rname=c=>RANKS[rank(c)]||String(rank(c));
const pretty=c=>rname(c)+SUITS[suit(c)];
const isCorner=i=>CORNERS.includes(i);
const copyObj=o=>JSON.parse(JSON.stringify(o));
const nextPlayer=s=>s.players[s.turn];
function createDeck(){let deck=[];for(const s of 'HDCS')for(let n=1;n<=13;n++)deck.push(n+s);for(let i=deck.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[deck[i],deck[j]]=[deck[j],deck[i]];}return deck;}
function canBuild(card,onto){return rank(card)===rank(onto)-1 && isRed(card)!==isRed(onto);}
function canPlace(card,pile,i){return pile.length ? canBuild(card,pile[pile.length-1]) : (!isCorner(i)||rank(card)===13);}
function canMove(piles,from,to){if(from===to||!piles[from].length)return false;return canPlace(piles[from][0],piles[to],to);}
function hydrateGame(raw){if(!raw)return raw;const s=copyObj(raw);s.players=(s.players||[]).filter(Boolean).map(p=>({...p,hand:p.hand||[],score:p.score||0}));s.members=s.members||Object.fromEntries(s.players.map(p=>[p.id,true]));s.stock=s.stock||[];s.piles=Array.from({length:8},(_,i)=>s.piles?.[i]||[]);s.log=s.log||[];s.turn=s.turn||0;s.movesThisTurn=s.movesThisTurn||0;s.passes=s.passes||0;s.maxRounds=Math.max(safeRounds(s.maxRounds),s.round||0);s.matchWinners=s.matchWinners||[];return s;}
function addLog(s,line){s.log=[line,...(s.log||[])].slice(0,7);}
function baseGame(players,host){return {version:0,phase:'lobby',host,members:Object.fromEntries(players.map(p=>[p.id,true])),players:players.map(p=>({id:p.id,name:p.name,hand:[],score:p.score||0})),turn:0,turnDrawn:false,movesThisTurn:0,passes:0,stock:[],piles:Array.from({length:8},()=>[]),round:0,maxRounds:safeRounds(model.matchRounds),matchWinners:[],winner:null,log:[]};}
function dealRound(s){if((s.round||0)>=safeRounds(s.maxRounds))return s;s.phase='playing';s.round=(s.round||0)+1;s.winner=null;s.turn=0;s.turnDrawn=false;s.movesThisTurn=0;s.passes=0;s.piles=Array.from({length:8},()=>[]);s.stock=createDeck();s.players.forEach(p=>{p.hand=[];for(let n=0;n<7;n++)p.hand.push(s.stock.pop());});for(let side of SIDES){let next=s.stock.pop();while(next&&rank(next)===13&&CORNERS.some(i=>s.piles[i].length===0)){s.piles[CORNERS.find(i=>s.piles[i].length===0)].push(next);next=s.stock.pop();}if(next)s.piles[side].push(next);}s.log=[];addLog(s,'بدأت الجولة '+s.round+' — أول دور: '+s.players[0].name);s.version++;return s;}
function finishRound(s,winnerId,note){s.winner=winnerId;s.players.forEach(p=>{if(p.id!==winnerId)p.score+=p.hand.reduce((t,c)=>t+(rank(c)===13?10:1),0);});const final=(s.round>=safeRounds(s.maxRounds));s.phase=final?'matchFinished':'finished';if(final){const min=Math.min(...s.players.map(p=>p.score));s.matchWinners=s.players.filter(p=>p.score===min).map(p=>p.id);addLog(s,'انتهت المباراة المحددة بـ '+s.maxRounds+' جولات');}addLog(s,note);}
function applyAction(original,action,uid){
 if(!original||original.phase!=='playing')return {error:'الجولة غير جارية'};
 const s=hydrateGame(original),p=nextPlayer(s);
 if(!p||p.id!==uid)return {error:'الدور للاعب آخر'};
 if(action.type==='draw'){
   if(s.turnDrawn)return {error:'سحبت ورقتك بالفعل'};
   const c=s.stock.pop();if(c)p.hand.push(c);s.turnDrawn=true;
   addLog(s,p.name+(c?' سحب ورقة':' بدأ دوره بعد نفاد السحب'));
 }else if(action.type==='play'){
   if(!s.turnDrawn)return {error:'اسحب ورقة أولًا'};
   const ci=p.hand.indexOf(action.card);const i=action.to;
   if(ci<0||!Number.isInteger(i)||i<0||i>7)return {error:'الورقة غير متاحة'};
   if(!canPlace(action.card,s.piles[i],i))return {error:'هذه الورقة لا تصلح لهذا الركن'};
   p.hand.splice(ci,1);s.piles[i].push(action.card);s.movesThisTurn++;
   s.passes=0;addLog(s,p.name+' وضع '+pretty(action.card));
   if(p.hand.length===0)finishRound(s,p.id,'انتهت الجولة! الفائز: '+p.name);
 }else if(action.type==='move'){
   if(!s.turnDrawn)return {error:'اسحب ورقة أولًا'};
   const from=action.from,to=action.to;
   if(!Number.isInteger(from)||!Number.isInteger(to)||from<0||from>7||to<0||to>7||!canMove(s.piles,from,to))return {error:'لا يمكن نقل هذه المجموعة إلى هذا الموضع'};
   s.piles[to].push(...s.piles[from]);s.piles[from]=[];s.movesThisTurn++;
   s.passes=0;addLog(s,p.name+' نقل مجموعة ورق كاملة');
 }else if(action.type==='end'){
   if(!s.turnDrawn)return {error:'اسحب ورقة أولًا'};
   s.passes=s.movesThisTurn===0?s.passes+1:0;
   if(s.stock.length===0&&s.passes>=s.players.length){
     const scored=s.players.map(x=>({id:x.id,points:x.hand.reduce((t,c)=>t+(rank(c)===13?10:1),0)})).sort((a,b)=>a.points-b.points);
     finishRound(s,scored[0].id,'نفدت أوراق السحب وتعذّر التقدّم؛ فاز صاحب أقل نقاط');
   }else{
     s.turn=(s.turn+1)%s.players.length;s.turnDrawn=false;s.movesThisTurn=0;
     addLog(s,'انتهى دور '+p.name+' — الدور الآن: '+nextPlayer(s).name);
   }
 }else{return {error:'إجراء غير معروف'};}
 s.version++;
 return {game:s};
}
function validPlays(s,uid){if(!s||s.phase!=='playing'||nextPlayer(s)?.id!==uid||!s.turnDrawn)return [];const p=nextPlayer(s),out=[];for(const c of p.hand)for(let i=0;i<8;i++)if(canPlace(c,s.piles[i],i))out.push({type:'play',card:c,to:i});return out;}
function validMoves(s,uid){if(!s||s.phase!=='playing'||nextPlayer(s)?.id!==uid||!s.turnDrawn)return [];const out=[];for(let i=0;i<8;i++)for(let j=0;j<8;j++)if(canMove(s.piles,i,j))out.push({type:'move',from:i,to:j});return out;}
function notify(msg){const old=$('.toast');if(old)old.remove();clearTimeout(toastTimeout);const d=document.createElement('div');d.className='toast';d.textContent=msg;document.body.appendChild(d);toastTimeout=setTimeout(()=>d.remove(),2800);}
let audioEngine=null;
function armAudio(){
 if(!model.soundOn)return;
 try{const C=window.AudioContext||window.webkitAudioContext;if(!C)return;audioEngine=audioEngine||new C();if(audioEngine.state==='suspended')audioEngine.resume().catch(()=>{});}catch{}
}
function playSound(type){
 if(!model.soundOn||!audioEngine||audioEngine.state!=='running')return;
 try{
 const ctx=audioEngine,start=ctx.currentTime,vol=ctx.createGain();vol.connect(ctx.destination);
 const sounds={draw:[470,410,.085,.023],place:[310,255,.105,.027],move:[380,305,.12,.027],undo:[280,370,.12,.02],win:[440,660,.20,.024]};
 const [a,b,d,peak]=sounds[type]||sounds.place;
 vol.gain.setValueAtTime(.0001,start);vol.gain.exponentialRampToValueAtTime(peak,start+.015);vol.gain.exponentialRampToValueAtTime(.0001,start+d);
 const osc=ctx.createOscillator();osc.type='sine';osc.frequency.setValueAtTime(a,start);osc.frequency.exponentialRampToValueAtTime(b,start+d);osc.connect(vol);osc.start(start);osc.stop(start+d+.012);
 }catch{}
}
function botLevelOptions(){return `<div class="bot-level" role="group" aria-label="مستوى الكمبيوتر">${[['easy','سهل'],['normal','متوسط'],['pro','محترف']].map(([k,label])=>`<button type="button" data-action="bot-level" data-level="${k}" class="level-option ${model.botLevel===k?'selected':''}" aria-pressed="${model.botLevel===k}">${label}</button>`).join('')}</div>`;}
function canUndo(){return model.mode==='solo'&&model.game?.phase==='playing'&&isMyTurn()&&model.game.turnDrawn&&model.undoStack.length>0&&!model.actionBusy;}
function undoLastMove(){if(!canUndo())return notify('التراجع متاح قبل إنهاء دورك فقط');model.game=model.undoStack.pop();model.botStep=null;resetSelection();saveLocal();render();playSound('undo');notify('تم التراجع عن آخر نقلة');}
function startVisualFeedback(el){if(!el)return;el.classList.remove('just-placed');void el.offsetWidth;el.classList.add('just-placed');}
function animateHuman(action,startPoint){
 if(window.matchMedia?.('(prefers-reduced-motion: reduce)').matches)return Promise.resolve();
 const src=action.type==='draw'?document.querySelector('.center-deck .card.back'):
   action.type==='play'?document.querySelector(`.hand-card[data-card="${action.card}"] .card`):
   document.querySelector(`.pile[data-i="${action.from}"] .board-token-photo .card`);
 const dst=action.type==='draw'?document.querySelector('.play-bottom .hand'):document.querySelector(`.pile[data-i="${action.to}"]`);
 if(!src||!dst)return Promise.resolve();
 const a=src.getBoundingClientRect(),b=dst.getBoundingClientRect();
 const ghost=document.createElement('div');ghost.className='human-flight';
 ghost.innerHTML=action.type==='draw'?'<div class="card back"></div>':cardHTML(action.type==='play'?action.card:model.game.piles[action.from].at(-1));
 const width=Math.min(Math.max(a.width,40),80),height=width*1.42;
 const sx=startPoint?.x??a.left+a.width/2,sy=startPoint?.y??a.top+a.height/2;
 const dx=b.left+b.width/2-sx,dy=b.top+b.height/2-sy;
 ghost.style.cssText=`left:${sx}px;top:${sy}px;width:${width}px;height:${height}px`;
 document.body.appendChild(ghost);
 const ms=action.type==='draw'?300:350;
 return (async()=>{try{if(ghost.animate){const anim=ghost.animate([
 {transform:'translate(-50%,-50%) rotate(-7deg) scale(1)',opacity:1,offset:0},
 {transform:`translate(calc(-50% + ${dx*.58}px),calc(-50% + ${dy*.58-14}px)) rotate(5deg) scale(1.06)`,opacity:1,offset:.55},
 {transform:`translate(calc(-50% + ${dx}px),calc(-50% + ${dy}px)) rotate(0deg) scale(.82)`,opacity:.94,offset:1}
 ],{duration:ms,easing:'cubic-bezier(.22,.82,.25,1)',fill:'forwards'});await anim.finished.catch(()=>{});}else await sleep(ms);}finally{ghost.remove();}})();
}
async function performLocalAction(action,startPoint=null){
 if(model.actionBusy||!model.game||model.game.phase!=='playing')return false;
 model.actionBusy=true;
 try{
  armAudio();
  const drawnCard=action.type==='draw'?model.game.stock.at(-1):null;
  if(['draw','play','move'].includes(action.type))await animateHuman(action,startPoint);
  if(!model.game||model.game.phase!=='playing')return false;
  model.actionBusy=false;
  const ok=applyLocal(action);
  if(ok&&action.type==='draw'&&drawnCard&&!window.matchMedia?.('(prefers-reduced-motion: reduce)').matches){
    const el=document.querySelector(`.hand-card[data-card="${drawnCard}"] .card`);
    el?.animate([{transform:'rotateY(-78deg) scale(.92)',opacity:.35},{transform:'rotateY(0) scale(1)',opacity:1}],{duration:310,easing:'ease-out'});
  }
  if(ok&&['play','move'].includes(action.type))startVisualFeedback(document.querySelector(`.pile[data-i="${action.to}"]`));
  return ok;
 }finally{model.actionBusy=false;}
}
function saveLocal(){if(model.mode!=='online'&&model.game)localStorage.setItem(LOCAL_KEY,JSON.stringify({mode:model.mode,game:model.game}));}
function resetSelection(){model.selected=null;model.hint=false;}
function applyLocal(action,asUid){
 const actingId=asUid||nextPlayer(model.game).id;
 const soloHuman=model.mode==='solo'&&actingId==='human';
 const snapshot=soloHuman&&['play','move'].includes(action.type)?copyObj(model.game):null;
 const r=applyAction(model.game,action,actingId);
 if(r.error){notify(r.error);return false;}
 if(snapshot)model.undoStack.push(snapshot);
 if(soloHuman&&action.type==='end')model.undoStack=[];
 if(!actingId.startsWith('bot'))model.botStep=null;
 model.game=r.game;resetSelection();saveLocal();render();
 if(action.type==='draw')playSound('draw');
 if(action.type==='play')playSound('place');
 if(action.type==='move')playSound('move');
 if(['finished','matchFinished'].includes(r.game.phase))playSound('win');
 if(!botBusy)scheduleBots();
 return true;
}
const sleep=ms=>new Promise(ok=>setTimeout(ok,ms));
function cancelBotTurn(){botGeneration++;botBusy=false;model.botStep=null;document.querySelectorAll('.flying-card').forEach(x=>x.remove());}
function botSpeedOptions(){return `<div class="bot-speed" role="group" aria-label="سرعة حركة الكمبيوتر"><span>سرعة الكمبيوتر:</span>${[['slow','بطيء'],['normal','متوسط'],['fast','سريع']].map(([key,label])=>`<button type="button" data-action="bot-speed" data-speed="${key}" class="speed-option ${model.botSpeed===key?'selected':''}" aria-pressed="${model.botSpeed===key}">${label}</button>`).join('')}</div>`;}
function describeBotMove(action,id){const name=nextPlayer(model.game).name;
 if(action.type==='draw')return `${name} يسحب ورقة من الرزمة`;
 if(action.type==='play')return `${name} يضع ${pretty(action.card)} في ${PILE_NAMES[action.to]}`;
 if(action.type==='move')return `${name} ينقل ${model.game.piles[action.from].length} ورقة من ${PILE_NAMES[action.from]} إلى ${PILE_NAMES[action.to]}`;
 return `${name} ينهي دوره`;
}
function botStartElement(action,id){return action.type==='draw'?document.querySelector('.center-deck .card.back'):action.type==='play'?document.querySelector(`[data-player-id="${id}"]`):document.querySelector(`.pile[data-i="${action.from}"] .card`)||document.querySelector(`.pile[data-i="${action.from}"]`);}
function botEndElement(action,id){return action.type==='draw'?document.querySelector(`[data-player-id="${id}"]`):document.querySelector(`.pile[data-i="${action.to}"]`);}
// Flight is a transient presentation element. The move is committed only AFTER the flight ends.
async function flyBotMove(action,id,duration){
 const start=botStartElement(action,id),end=botEndElement(action,id);
 if(!start||!end){await sleep(duration);return;}
 const a=start.getBoundingClientRect(),b=end.getBoundingClientRect();
 const code=action.type==='play'?action.card:action.type==='move'?model.game.piles[action.from].at(-1):null;
 const ghost=document.createElement('div');ghost.className='flying-card';
 ghost.innerHTML=code?cardHTML(code):'<div class="card back"></div>';
 if(action.type==='move'&&model.game.piles[action.from].length>1){const badge=document.createElement('span');badge.className='flight-count';badge.textContent=model.game.piles[action.from].length+' ورق';ghost.appendChild(badge);}
 document.body.appendChild(ghost);
 const card=ghost.querySelector('.card');const width=card.getBoundingClientRect().width,height=card.getBoundingClientRect().height;
 const sx=a.left+a.width/2-width/2,sy=a.top+a.height/2-height/2;
 const dx=b.left+b.width/2-width/2-sx,dy=b.top+b.height/2-height/2-sy;
 ghost.style.left=sx+'px';ghost.style.top=sy+'px';
 try{
   if(ghost.animate){const anim=ghost.animate([{transform:'translate(0,0) scale(1)',opacity:.95},{transform:`translate(${dx}px,${dy}px) scale(1.08)`,opacity:1}],{duration,easing:'ease-in-out',fill:'forwards'});await anim.finished.catch(()=>{});}
   else await sleep(duration);
 }finally{ghost.remove();}
}
function scheduleBots(){if(model.mode!=='solo'||botBusy||model.game?.phase!=='playing'||!nextPlayer(model.game)?.id.startsWith('bot'))return;botBusy=true;const generation=botGeneration;setTimeout(()=>runBots(generation),300);}
async function animatedBotAction(action,id,generation){
 if(generation!==botGeneration||model.mode!=='solo'||model.game?.phase!=='playing'||nextPlayer(model.game)?.id!==id)return false;
 const speed=BOT_SPEED[model.botSpeed]||BOT_SPEED.slow;
 model.botStep={label:describeBotMove(action,id),from:action.type==='move'?action.from:null,to:['play','move'].includes(action.type)?action.to:null,id,stage:'moving',actionType:action.type};
 render();
 if(action.type==='draw'&&model.game.stock.length===0)await sleep(Math.min(speed.flight,500));
 else await flyBotMove(action,id,speed.flight);
 if(generation!==botGeneration||model.mode!=='solo'||model.game?.phase!=='playing'||nextPlayer(model.game)?.id!==id)return false;
 if(!applyLocal(action,id))return false;
 model.botStep.stage='done';render();
 await sleep(speed.hold);
 return generation===botGeneration&&model.mode==='solo';
}
function chooseBotPlan(game,id,mergeCount){
 const plays=validPlays(game,id);
 const moves=mergeCount>=6?[]:validMoves(game,id).filter(x=>game.piles[x.to].length>0&&game.piles[x.from].length>0);
 const level=model.botLevel;
 if(level==='easy'){
   if(plays.length&&(!moves.length||Math.random()<.84))return plays[Math.floor(Math.random()*plays.length)];
   if(moves.length&&Math.random()<.52)return moves[Math.floor(Math.random()*moves.length)];
   return null;
 }
 if(level==='normal'){
   if(plays.length){const ordered=plays.sort((a,b)=>(rank(b.card)===13?100:rank(b.card))-(rank(a.card)===13?100:rank(a.card)));return ordered[0];}
   return moves[0]||null;
 }
 // Expert: considers own hand + visible table only, not opponents' hidden cards.
 // Look one move ahead to reward immediate hand release and useful pile consolidation.
 let best=null,bestScore=-Infinity;
 const before=plays.length;
 const candidates=[...plays,...moves];
 for(const action of candidates){
  const result=applyAction(game,action,id);
  if(result.error)continue;
  const next=result.game;
  let score;
  if(action.type==='play'){
   score=34+rank(action.card)*2.5+(rank(action.card)===13?32:0);
   if(['finished','matchFinished'].includes(next.phase))score+=10000;
   score+=validPlays(next,id).length*4.5;
   const hand=next.players.find(x=>x.id===id)?.hand||[];
   // Playing aces or low cards can expose completion opportunities, but kings are costliest.
   if(hand.some(c=>rank(c)===13)&&rank(action.card)!==13&&CORNERS.some(i=>!next.piles[i].length))score-=3;
  }else{
   const after=validPlays(next,id).length;
   const newlyOpen=(!CORNERS.includes(action.from)&&next.piles[action.from].length===0)?1:0;
   score=9+(after-before)*18+newlyOpen*12+(next.piles[action.to].length>=3?3:0);
   if(plays.length&&after<=before)score-=45;
  }
  score+=Math.random()*.01;
  if(score>bestScore){bestScore=score;best=action;}
 }
 return best;
}
async function runBots(generation){
 try{let nTurns=0;
 while(generation===botGeneration&&model.mode==='solo'&&model.game?.phase==='playing'&&nextPlayer(model.game)?.id.startsWith('bot')&&nTurns<4){
  nTurns++;const id=nextPlayer(model.game).id;
  if(!await animatedBotAction({type:'draw'},id,generation))break;
  let limit=50,mergeCount=0;
  while(generation===botGeneration&&model.game?.phase==='playing'&&nextPlayer(model.game)?.id===id&&limit-->0){
   const choice=chooseBotPlan(model.game,id,mergeCount);
   if(!choice)break;
   if(choice.type==='move')mergeCount++;
   if(!await animatedBotAction(choice,id,generation))break;
  }
  if(generation!==botGeneration||model.mode!=='solo'||model.game?.phase!=='playing'||nextPlayer(model.game)?.id!==id)break;
  const speed=BOT_SPEED[model.botSpeed]||BOT_SPEED.slow;
  await sleep(Math.min(speed.hold,600));
  if(generation!==botGeneration||model.mode!=='solo')break;
  if(!applyLocal({type:'end'},id))break;
 }
 }finally{if(generation===botGeneration){botBusy=false;if(model.mode==='solo')render();}}
}
function myId(){return model.mode==='online'?model.uid:model.mode==='solo'?'human':nextPlayer(model.game)?.id;}
function isMyTurn(){const s=model.game;return s?.phase==='playing'&&nextPlayer(s)?.id===myId()&&!model.cover;}
function pipCoords(r){const m={2:[[50,26],[50,74]],3:[[50,23],[50,50],[50,77]],4:[[30,25],[70,25],[30,75],[70,75]],5:[[30,25],[70,25],[50,50],[30,75],[70,75]],6:[[30,22],[70,22],[30,50],[70,50],[30,78],[70,78]],7:[[30,20],[70,20],[50,34],[30,50],[70,50],[30,80],[70,80]],8:[[30,20],[70,20],[30,39],[70,39],[30,61],[70,61],[30,80],[70,80]],9:[[30,19],[70,19],[50,32],[30,44],[70,44],[50,56],[30,68],[70,68],[50,81]],10:[[30,18],[70,18],[30,34],[70,34],[30,50],[70,50],[30,66],[70,66],[30,82],[70,82]]};return m[r]||[];}

function cardSVG(code){const r=rank(code), sym=SUITS[suit(code)], fill=isRed(code)?'#c73d49':'#15222e';const top=svgText(14,18,rname(code),16,fill,'middle','font-weight="700"')+svgText(14,33,sym,17,fill);const bottom=`<g transform="translate(100,140) rotate(180)">${svgText(14,18,rname(code),16,fill,'middle','font-weight="700"')+svgText(14,33,sym,17,fill)}</g>`;let center='';if(r===1){center=svgText(50,82,sym,46,fill);}else if(r>=11){center=faceArt(r,sym,fill);}else{center=pipCoords(r).map(([x,y])=>svgText(x,y+5,sym,21,fill)).join('');}return `<svg viewBox="0 0 100 140" aria-hidden="true">${top}${bottom}${center}</svg>`;}

function pilePreview(pile){if(!pile.length)return[];if(pile.length===1)return[{card:pile[0],note:'الورقة'}];return[{card:pile[0],note:'الأولى'},{card:pile[pile.length-1],note:'الأخيرة'}];}
// On the small landscape board, show a readable index PLUS the authentic card art.
// The full-size traditional cards are available through the inspect control.
function boardTokenHTML(item){const c=item.card;return `<span class="board-token ${isRed(c)?'is-red':'is-black'}" data-card-code="${escapeHTML(c)}" aria-label="${escapeHTML(item.note+' '+pretty(c))}"><span class="board-token-index" dir="ltr"><strong>${rname(c)}</strong><strong class="board-token-suit">${SUITS[suit(c)]}</strong></span><span class="board-token-photo">${cardHTML(c,'pile')}</span>${item.note==='الورقة'?'':`<span class="board-token-caption">${item.note}</span>`}</span>`;}
function pileHTML(pile,i){const isSel=model.selected?.kind==='pile'&&model.selected.index===i;const s=model.game,canAct=isMyTurn()&&s.turnDrawn;let marked=false;if(canAct&&model.selected?.kind==='hand')marked=canPlace(model.selected.card,pile,i);if(canAct&&model.selected?.kind==='pile')marked=canMove(s.piles,model.selected.index,i);if(model.hint&&canAct){const v=validPlays(s,myId());if(v.some(x=>x.to===i))marked=true;}const labels=['ركن الشايب','أعلى','ركن الشايب','يسار','يمين','ركن الشايب','أسفل','ركن الشايب'];const preview=pilePreview(pile);return `<div class="pile-wrap slot-${i}"><button class="pile ${model.mode==='solo'&&model.botStep?.from===i?'bot-source':''} ${model.mode==='solo'&&model.botStep?.to===i?'bot-target':''} ${isSel?'selected':''} ${marked?'target':''}" data-action="pile" data-i="${i}" title="${labels[i]} — ${pile.length} ورقة"><span class="pile-label">${labels[i]}</span>${pile.length?`<div class="stack ${pile.length===1?'stack-one':'stack-two'}"><span class="board-token-row">${preview.map(boardTokenHTML).join('')}</span>${pile.length>2?`<span class="stack-between">+ ${pile.length-2} وسط</span>`:''}<span class="stack-count">${pile.length} ورقة</span></div>`:`<span class="pile-empty">${isCorner(i)?'♛ مكان الشايب':'موضع فارغ'}</span>`}</button>${pile.length?`<button class="inspect-btn" type="button" data-action="inspect-pile" data-i="${i}" title="شاهد كل أوراق السلسلة">⤢</button>`:''}</div>`;}
function pileInspectorHTML(){const i=model.inspectPile;if(i===null||i===undefined||!model.game)return '';const cards=model.game.piles[i]||[];const labels=['ركن الشايب','أعلى','ركن الشايب','يسار','يمين','ركن الشايب','أسفل','ركن الشايب'];const canSelect=isMyTurn()&&model.game.turnDrawn;return `<div class="overlay"><div class="modal inspect-modal"><h2>🔍 ${labels[i]}</h2><p class="tiny">${cards.length} ورقة — الترتيب من بداية السلسلة إلى نهايتها. الورقة الأخيرة هي التي تُضاف عليها الأوراق الجديدة.</p><div class="inspect-sequence">${cards.map((c,j)=>`<div class="inspect-item"><span>${j===0?'أول ورقة':j===cards.length-1?'آخر ورقة':`الورقة ${j+1}`}</span>${cardHTML(c,'inspection')}<b>${pretty(c)}</b></div>`).join('')}</div><div class="panel-actions">${button('إغلاق','close-inspect','sm')}${canSelect?button('تحديد هذه السلسلة للنقل','use-inspect','primary'):''}</div></div></div>`;}

function scoreHTML(s){
 const players=[...s.players].sort((a,b)=>a.score-b.score);
 return `<table class="scoretable"><thead><tr><th>اللاعب</th><th>نقاط الجولة</th><th>المجموع</th></tr></thead><tbody>${players.map(p=>{
   const roundPoints=p.id===s.winner?0:p.hand.reduce((t,c)=>t+(rank(c)===13?10:1),0);
   return `<tr class="${s.winner===p.id?'winner-row':''}"><td>${s.winner===p.id?'🏆 ':''}${escapeHTML(p.name)}</td><td>${roundPoints}</td><td>${p.score}</td></tr>`;
 }).join('')}</tbody></table>`;
}
function resultHeader(s){if(s.phase==='matchFinished'){const names=(s.matchWinners||[]).map(id=>s.players.find(p=>p.id===id)?.name).filter(Boolean);return names.length>1?'🤝 تعادل على المركز الأول: '+names.join(' و '):'🏆 بطل المباراة: '+(names[0]||'');}return '🏆 فائز الجولة: '+(s.players.find(p=>p.id===s.winner)?.name||'');}
function resultSubline(s){return s.phase==='matchFinished'?'الترتيب النهائي بعد '+s.maxRounds+' جولات · الأقل نقاطًا أفضل':'نتائج الجولة '+s.round+' من '+s.maxRounds+' · الأقل نقاطًا أفضل';}
function gameHTML(){
 const s=model.game;if(!s)return '<div class="panel">جار تحميل المباراة...</div>';
 const current=nextPlayer(s),mine=s.players.find(p=>p.id===myId()),turn=isMyTurn(),drawn=s.turnDrawn;
 const meHand=mine?.hand||[];
 const awaiting=turn&&!drawn;
 const hands=[...meHand].sort((a,b)=>rank(b)-rank(a)||suit(a).localeCompare(suit(b)));
 const status=s.phase==='matchFinished'?'انتهت المباراة':s.phase==='finished'?'انتهت الجولة':turn?(drawn?'دورك الآن: اختر ورقة ثم خانة أو أنهِ الدور':'دورك الآن: اسحب من وسط الطاولة'):'الدور الآن: '+escapeHTML(current.name);
 const guestPlayers=s.players.filter(p=>p.id!==myId());
 const seatLayouts={1:['top'],2:['left','right'],3:['top','left','right']};
 const positions=seatLayouts[guestPlayers.length]||['top','left','right'];
 const guests=guestPlayers.map((p,idx)=>`<div data-player-id="${escapeHTML(p.id)}" class="play-seat ${positions[idx]||'top'} ${p.id===current.id?'active':''}" title="${escapeHTML(p.name)}"><strong>${p.hand.length}</strong><span class="seat-name">${escapeHTML(p.name)}</span></div>`).join('');
 const cards=`<div class="hand" style="--hand-n:${Math.max(hands.length,1)}">${hands.map((c,i)=>`<button type="button" class="hand-card ${model.selected?.kind==='hand'&&model.selected.card===c?'sel':''} ${model.hint&&validPlays(s,myId()).some(x=>x.card===c)?'hint':''}" style="--hand-frac:${hands.length===1?0.5:(i/(hands.length-1)).toFixed(4)};--hand-tilt:${(hands.length===1?0:(i/(hands.length-1)-.5)*8).toFixed(2)}deg;--hand-z:${i+1}" data-action="hand" data-card="${c}" ${!turn||!drawn||s.phase!=='playing'?'disabled':''} title="${pretty(c)}">${cardHTML(c)}</button>`).join('')}</div>`;
 const board=[0,1,2,3,'deck',4,5,6,7].map(i=>i==='deck'?`<div class="center-deck"><button type="button" class="deck-btn" data-action="draw" ${!turn||drawn||s.phase!=='playing'?'disabled':''} title="اسحب ورقة من الوسط"><div class="card back"></div><span class="deck-n">${s.stock.length}</span></button><small>${awaiting?'اضغط للسحب':'السحب'}</small></div>`:pileHTML(s.piles[i],i)).join('');
 const end=turn&&s.phase==='playing'?`<button type="button" class="play-mini primary" data-action="end" ${!drawn?'disabled':''}>إنهاء الدور</button>${model.selected?`<button type="button" class="play-mini" data-action="clear">إلغاء</button>`:''}${model.mode==='solo'&&canUndo()?`<button type="button" class="play-mini undo-short" data-action="undo" title="التراجع عن آخر نقلة">↶</button>`:''}`:`<span class="hint-text">${s.phase==='matchFinished'?'انتهت المباراة':s.phase==='finished'?'انتهت الجولة':'انتظر دورك'}</span>`;
 const winner=['finished','matchFinished'].includes(s.phase)?`<div class="game-winner-overlay" role="dialog" aria-modal="true" aria-label="نتائج الجولة"><div class="game-winner-card"><h2>${escapeHTML(resultHeader(s))}</h2><p class="winner-subtitle">${escapeHTML(resultSubline(s))}</p><div class="results-scroll">${scoreHTML(s)}</div><div class="winner-actions">${model.mode!=='online'||s.host===model.uid?button(s.phase==='matchFinished'?'🏁 مباراة جديدة':'↻ الجولة التالية','restart','primary'):'<p class="winner-wait">بانتظار قائد الغرفة لبدء الجولة التالية</p>'}</div></div></div>`:'';
 const bottomInstruction=model.botStep?escapeHTML(model.botStep.label):model.selected?.kind==='hand'?'اختر خانة على الطاولة':model.selected?.kind==='pile'?'اختر السلسلة الوجهة':status;
 const gameMenu=model.gameMenuOpen?`<div class="game-menu-panel" role="menu" aria-label="قائمة اللعبة">
    <div class="game-menu-heading"><strong>خيارات اللعب</strong><button type="button" class="game-menu-close" data-action="close-game-menu" aria-label="إغلاق القائمة">✕</button></div>
    ${model.mode==='solo'?`<div class="game-menu-field"><span>ذكاء الكمبيوتر</span>${botLevelOptions()}</div><div class="game-menu-field"><span>سرعة الكمبيوتر</span>${botSpeedOptions()}</div>`:''}
    <button type="button" class="game-menu-choice" data-action="toggle-sound" aria-pressed="${model.soundOn}">${model.soundOn?'🔊 الصوت: مفعّل':'🔇 الصوت: صامت'}</button>
    ${model.mode==='solo'?`<button type="button" class="game-menu-choice" data-action="undo" ${!canUndo()?'disabled':''}>↶ تراجع عن آخر نقلة</button>`:''}
    <div class="game-menu-field">اضغط مطولًا لتكبير الورقة. يمكنك السحب إلى خانة مضيئة أو الضغط على الورقة ثم الخانة.</div>
    <button type="button" class="game-menu-choice" data-action="hint" ${!turn||!drawn?'disabled':''}>💡 تلميح للحركة</button>
    <button type="button" class="game-menu-choice" data-action="rules">؟ قواعد اللعبة</button>
    <button type="button" class="game-menu-choice" data-action="restart">↻ بدء مباراة جديدة</button>
    <button type="button" class="game-menu-choice" data-action="settings">☁ إعداد المزامنة</button>
    <button type="button" class="game-menu-choice" data-action="home">⌂ الرئيسية</button>
    </div>`:'';
 return `<div class="play-shell" aria-label="طاولة الشايب بالركن">
  <div class="play-stage">
    <div class="table-floating-tools"><span class="table-round-label">♛ الجولة ${s.round||1} / ${safeRounds(s.maxRounds)}</span><button type="button" class="table-menu-btn" data-action="toggle-game-menu" aria-haspopup="menu" aria-expanded="${!!model.gameMenuOpen}" title="خيارات اللعب">⚙</button></div>
    <div class="play-seats">${guests}</div>
    <div class="play-board board">${board}</div>
  </div>
  <div class="play-bottom"><div class="hand-header"><strong>${model.mode==='local'?'أوراق '+escapeHTML(current.name):'أوراقك'} (${hands.length})</strong><span class="hint-text" aria-live="polite">${bottomInstruction}</span></div><div class="play-hand-line">${cards}<div class="play-hand-actions">${end}</div></div></div>
  ${gameMenu}
  ${winner}
 </div>`;
}

function coverHTML(){if(!model.cover||model.game?.phase!=='playing')return '';return `<div class="cover"><div class="cover-inner"><div style="font-size:70px">🂠</div><h2>الجهاز عند ${escapeHTML(nextPlayer(model.game).name)}</h2><p style="line-height:1.9">سلّم الجهاز للاعب التالي، ثم اضغط الزر لكشف أوراقه. لا تُرِ الآخرين أوراقك.</p>${button('أنا جاهز — اكشف أوراقي','uncover','primary')}</div></div>`;}
function rulesHTML(){return `<div class="overlay"><div class="modal rules"><h2>قواعد الشايب بالركن</h2><ol><li>تُستخدم <b>٥٢ ورقة</b> دون جوكر، ويوزع <b>٧ أوراق</b> على كل لاعب، وتوضع ٤ أوراق على الجهات الأربع.</li><li>قبل أن تبدأ حركات دورك، <b>اسحب ورقة واحدة</b> من الرزمة ما دامت موجودة.</li><li>رتّب الورق <b>تنازليًا مع تغيير اللون</b>: مثال: ٩ أحمر ثم ٨ أسود ثم ٧ أحمر.</li><li>الأركان الأربعة لا تبدأ إلا بورقة <b>الشايب K</b>، ثم تُستكمل بالطريقة نفسها.</li><li>إذا أصبح أحد المواضع الجانبية فارغًا، يمكنك وضع أي ورقة فيه.</li><li>يجوز نقل <b>مجموعة أوراق كاملة</b> إلى مجموعة أخرى بشرط أن تناسب الورقة الموجودة أسفل المجموعة المنقولة أعلى المجموعة المستقبِلة.</li><li>يمكنك لعب عدة حركات، ثم إنهاء دورك. <b>أول لاعب يتخلص من أوراقه يفوز.</b></li><li>يُحسب على باقي اللاعبين <b>١٠ نقاط لكل شايب</b> ونقطة لكل ورقة أخرى؛ الأقل أفضل.</li></ol><p class="helper">هناك نسخ شعبية تختلف في وقت السحب وحساب النقاط؛ اعتمدنا القواعد الشائعة. عندما تنفد الرزمة ويتعذر على الجميع اللعب تفوز أقل يد من حيث النقاط.</p>${button('فهمت','close-dialog','primary')}</div></div>`;}
function settingsHTML(){let stored=localStorage.getItem('shayeb_firebase_config')||'';const input=stored|| (SHARED_FIREBASE_CONFIG?JSON.stringify(SHARED_FIREBASE_CONFIG,null,2):'');return `<div class="overlay"><div class="modal"><h2>⚙ إعداد المزامنة</h2><p>تعمل اللعبة الفردية والجماعية على جهاز واحد بلا إعداد. للمزامنة الحقيقية بين أجهزة مختلفة، أنشئ مشروع Firebase، وفعّل <b>Realtime Database</b> و<b>Anonymous Authentication</b>، ثم الصق إعداد تطبيق الويب.</p><div class="field"><label for="firebaseConfig">Firebase Web Config بصيغة JSON</label><textarea id="firebaseConfig" dir="ltr" spellcheck="false" placeholder='{"apiKey":"...","authDomain":"...","databaseURL":"...","projectId":"...","appId":"..."}'>${escapeHTML(input)}</textarea></div><div class="panel-actions">${button('حفظ واتصال','save-config','primary')}${button('القواعد','rules','sm')}${model.screen==='game'?button('إعادة الجولة','restart','sm'):''}${button('إغلاق','close-dialog')}</div><p class="tiny">لتمكين الأصدقاء دون إدخال الإعداد على كل جهاز، ضمّن الإعداد العام في المتغير SHARED_FIREBASE_CONFIG داخل ملف HTML قبل نشره. يجب ضبط قواعد قاعدة البيانات كما في ملف database.rules.json المرفق. هذا إصدار تجريبي وليس مخصصًا لمباريات تنافسية مؤمّنة.</p>${model.notice?`<div class="message error">${escapeHTML(model.notice)}</div>`:''}</div></div>`;}
function render(){document.documentElement.classList.toggle('table-xl',model.tableView==='xl');document.documentElement.classList.toggle('game-screen',model.screen==='game');let body;if(model.screen==='home')body=homeHTML();else if(model.screen==='solo-form')body=soloForm();else if(model.screen==='local-form')body=localForm();else if(model.screen==='online-form')body=onlineForm();else if(model.screen==='room')body=roomHTML();else body=gameHTML();appRoot.innerHTML=(model.screen==='game'?'':header())+body+((model.dialog==='rules')?rulesHTML():(model.dialog==='settings')?settingsHTML():'')+pileInspectorHTML()+coverHTML();}
function startLocal(mode){model.undoStack=[];model.actionBusy=false;model.gameMenuOpen=false;model.inspectPile=null;cancelBotTurn();const humanName=($('#playerName')?.value||model.name||'أنت').trim().slice(0,24);model.name=humanName;localStorage.setItem('shayeb-name',humanName);let players=[];if(mode==='solo'){players=[{id:'human',name:humanName},...Array.from({length:model.bots},(_,i)=>({id:'bot'+(i+1),name:'الكمبيوتر '+(i+1)}))];}else{players=Array.from({length:model.localPlayers},(_,i)=>({id:'local'+i,name:($('#localName'+i)?.value||'اللاعب '+(i+1)).trim().slice(0,24)}));}model.mode=mode;model.screen='game';model.game=dealRound(baseGame(players,players[0].id));model.cover=false;resetSelection();saveLocal();render();scheduleBots();}
function roomID(){const alphabet='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';const bytes=new Uint8Array(8);crypto.getRandomValues(bytes);return Array.from(bytes,b=>alphabet[b%alphabet.length]).join('');}
async function connectFirebase(cfg){if(!cfg?.apiKey||!cfg.databaseURL||!cfg.projectId||!cfg.appId)throw Error('أكمل حقول apiKey و databaseURL و projectId و appId');const ver=FIREBASE_CDN;const [fb,auth,db]=await Promise.all([import(`https://www.gstatic.com/firebasejs/${ver}/firebase-app.js`),import(`https://www.gstatic.com/firebasejs/${ver}/firebase-auth.js`),import(`https://www.gstatic.com/firebasejs/${ver}/firebase-database.js`)]);const appName='shayeb-'+cfg.projectId+'-'+cfg.appId.replace(/[^a-zA-Z0-9]/g,'').slice(-12);const obj=fb.getApps().find(x=>x.name===appName)||fb.initializeApp(cfg,appName);const a=auth.getAuth(obj);if(typeof a.authStateReady==='function')await a.authStateReady();const user=(a.currentUser|| (await auth.signInAnonymously(a)).user);cloud={db:db.getDatabase(obj),api:db,auth:a};model.uid=user.uid;model.connected=true;return cloud;}
function currentConfig(){try{return SHARED_FIREBASE_CONFIG||JSON.parse(localStorage.getItem('shayeb_firebase_config')||'null');}catch{return null;}}
async function connectIfReady(){const c=currentConfig();if(!c)return;try{await connectFirebase(c);render();}catch(e){model.notice='تعذر الاتصال: '+e.message;render();}}
function subscribeRoom(code){if(unsubscribe)unsubscribe();model.roomCode=code;model.mode='online';model.screen='room';const loc=cloud.api.ref(cloud.db,'rooms/'+code);unsubscribe=cloud.api.onValue(loc,snapshot=>{if(!snapshot.exists()){model.game=null;model.screen='online-form';notify('الغرفة غير موجودة أو أُغلقت');return render();}model.game=hydrateGame(snapshot.val());model.screen=model.game.phase==='lobby'?'room':'game';if(!model.game.players.some(p=>p.id===model.uid))model.screen='online-form';resetSelection();render();},e=>{model.notice=e.message;notify('انقطع الاتصال بالغرفة: '+e.message);});render();}
async function createRoom(){if(!cloud)return notify('أعدّ المزامنة أولًا');const name=($('#playerName')?.value||'لاعب').trim().slice(0,24)||'لاعب';model.name=name;localStorage.setItem('shayeb-name',name);let code=roomID();try{const loc=cloud.api.ref(cloud.db,'rooms/'+code);const res=await cloud.api.runTransaction(loc,old=>old===null?baseGame([{id:model.uid,name}],model.uid):undefined,{applyLocally:false});if(!res.committed)return notify('تعذر إنشاء الغرفة. حاول ثانية.');subscribeRoom(code);notify('تم إنشاء الغرفة');}catch(e){notify('فشل إنشاء الغرفة: '+e.message);}}
async function joinRoom(){if(!cloud)return notify('أعدّ المزامنة أولًا');const code=($('#joinCode')?.value||'').trim().toUpperCase().replace(/[^A-Z0-9]/g,'');if(code.length!==8)return notify('رمز الغرفة يتكوّن من ٨ أحرف أو أرقام');const name=($('#playerName')?.value||'لاعب').trim().slice(0,24)||'لاعب';model.name=name;localStorage.setItem('shayeb-name',name);let issue='';try{const loc=cloud.api.ref(cloud.db,'rooms/'+code);const res=await cloud.api.runTransaction(loc,current=>{if(!current){issue='الغرفة غير موجودة';return;}if(current.players.some(p=>p.id===model.uid))return current;if(current.phase!=='lobby'){issue='المباراة بدأت، لا يمكن الانضمام الآن';return;}if(current.players.length>=4){issue='الغرفة ممتلئة';return;}const next=hydrateGame(current);next.players.push({id:model.uid,name,hand:[],score:0});next.members[model.uid]=true;next.version++;return next;},{applyLocally:false});if(!res.committed)return notify(issue||'تعذر الانضمام');subscribeRoom(code);}catch(e){notify('فشل الانضمام: '+e.message);}}
async function changeOnline(update,label){if(!cloud||!model.roomCode)return;let error='';try{const loc=cloud.api.ref(cloud.db,'rooms/'+model.roomCode);const r=await cloud.api.runTransaction(loc,old=>{if(!old){error='الغرفة غير موجودة';return;}const result=update(hydrateGame(old));if(!result||result.error){error=result?.error||'إجراء غير صالح';return;}return result.game;},{applyLocally:false});if(!r.committed)notify(error||'لم تُحفظ الحركة؛ ربما تغيّر الدور');else resetSelection();}catch(e){notify('تعذّر تحديث الغرفة: '+e.message);}}
async function onlineAction(action){if(model.busy)return;model.busy=true;try{await changeOnline(g=>{if(!g.players.some(p=>p.id===model.uid))return {error:'أنت لست في هذه الغرفة'};return applyAction(g,action,model.uid);});}finally{model.busy=false;}}
async function startRoom(){await changeOnline(g=>{if(g.host!==model.uid)return{error:'بداية اللعبة لقائد الغرفة فقط'};if(g.phase!=='lobby'||g.players.length<2)return{error:'يلزم لاعبان للبدء'};return {game:dealRound(copyObj(g))};});}
async function restart(){model.undoStack=[];model.actionBusy=false;cancelBotTurn();if(model.mode==='online'){await changeOnline(g=>{if(g.host!==model.uid)return{error:'هذا الإجراء لقائد الغرفة فقط'};if(!['finished','matchFinished'].includes(g.phase))return{error:'الجولة لم تنتهِ'};if(g.phase==='finished')return{game:dealRound(copyObj(g))};const next=baseGame(g.players.map(p=>({id:p.id,name:p.name})),g.host);next.maxRounds=safeRounds(g.maxRounds);return{game:dealRound(next)};});}else{const g=model.game;const next=(g.phase==='finished'&&g.round<g.maxRounds)?copyObj(g):baseGame(g.players.map(p=>({id:p.id,name:p.name})),g.host);next.maxRounds=safeRounds(g.maxRounds);model.game=dealRound(next);model.cover=false;resetSelection();saveLocal();render();scheduleBots();}}
async function leaveRoom(){if(!cloud||!model.roomCode)return goHome();const code=model.roomCode;try{if(model.game?.phase==='lobby')await changeOnline(g=>{const next=copyObj(g);next.players=next.players.filter(p=>p.id!==model.uid);delete next.members[model.uid];if(!next.players.length)return{game:null};if(next.host===model.uid)next.host=next.players[0].id;next.version++;return{game:next};});}catch{}goHome();}
function goHome(){model.undoStack=[];model.actionBusy=false;model.gameMenuOpen=false;model.inspectPile=null;cancelBotTurn();if(unsubscribe){unsubscribe();unsubscribe=null;}model.mode='home';model.screen='home';model.game=null;model.roomCode='';model.cover=false;resetSelection();render();}
function selectedPile(i){if(!isMyTurn()||!model.game.turnDrawn)return notify('انتظر دورك واسحب ورقة أولًا');if(model.selected?.kind==='hand'){let cmd={type:'play',card:model.selected.card,to:i};model.mode==='online'?onlineAction(cmd):performLocalAction(cmd);return;}if(model.selected?.kind==='pile'){if(model.selected.index===i){resetSelection();render();return;}const cmd={type:'move',from:model.selected.index,to:i};if(!canMove(model.game.piles,cmd.from,cmd.to))return notify('المجموعة لا تناسب هذا الموضع');model.mode==='online'?onlineAction(cmd):performLocalAction(cmd);return;}if(model.game.piles[i].length){model.selected={kind:'pile',index:i};model.hint=false;render();}else notify('اختر ورقة من يدك أو مجموعة من الطاولة أولًا');}
function selectedCard(card){if(!isMyTurn()||!model.game.turnDrawn)return notify('اسحب أولًا');if(model.selected?.kind==='hand'&&model.selected.card===card){resetSelection();}else{model.selected={kind:'hand',card};model.hint=false;}render();}
function makeHint(){if(!isMyTurn()||!model.game.turnDrawn)return;model.hint=true;const possibilities=validPlays(model.game,myId());if(possibilities.length){const one=possibilities[0];notify('جرّب '+pretty(one.card)+' في '+(isCorner(one.to)?'أحد الأركان':'موضع مناسب'));}else{const m=validMoves(model.game,myId());notify(m.length?'يمكنك نقل مجموعة كاملة على أخرى':'لا توجد حركات واضحة؛ يمكنك إنهاء دورك');}render();}
async function shareRoom(){const code=model.roomCode;const hostUrl=location.protocol.startsWith('http')?location.origin+location.pathname+'?room='+code:'';const msg=hostUrl?'انضم إلى لعبة الشايب بالركن\n'+hostUrl+'\nالرمز: '+code:'رمز غرفة الشايب بالركن: '+code;try{if(navigator.share)await navigator.share({title:'الشايب بالركن',text:msg});else if(navigator.clipboard){await navigator.clipboard.writeText(msg);notify('نُسخت الدعوة');}else notify(msg);}catch(e){if(e.name!=='AbortError')notify('تعذرت المشاركة');}}
function safeText(v){return String(v||'').trim();}
appRoot.addEventListener('click',async evt=>{const b=evt.target.closest('[data-action]');if(!b)return;const act=b.dataset.action;
 if(model.actionBusy&&['hand','pile','draw','end','undo'].includes(act))return;
 if(['draw','hand','pile','toggle-sound'].includes(act))armAudio();
 try{
 if(act==='home'){model.inspectPile=null;if(model.mode==='online'&&model.screen!=='home'){goHome();}else goHome();}
 else if(act==='solo-form'||act==='local-form'||act==='online-form'){model.screen=act;render();}
 else if(act==='toggle-game-menu'){model.gameMenuOpen=!model.gameMenuOpen;render();}
 else if(act==='close-game-menu'){model.gameMenuOpen=false;render();}
 else if(act==='choose-bots'){model.bots=Number(b.dataset.n);render();}
 else if(act==='choose-rounds'){model.matchRounds=safeRounds(b.dataset.n);localStorage.setItem(ROUNDS_KEY,model.matchRounds);render();}
 else if(act==='bot-level'){if(['easy','normal','pro'].includes(b.dataset.level)){model.botLevel=b.dataset.level;localStorage.setItem(BOT_LEVEL_KEY,model.botLevel);render();}}
 else if(act==='toggle-sound'){model.soundOn=!model.soundOn;localStorage.setItem(SOUND_KEY,model.soundOn?'on':'off');if(model.soundOn)armAudio();render();}
 else if(act==='undo')undoLastMove();
 else if(act==='bot-speed'){if(BOT_SPEED[b.dataset.speed]){model.botSpeed=b.dataset.speed;localStorage.setItem(BOT_SPEED_KEY,model.botSpeed);render();}}
 else if(act==='toggle-table'){model.tableView=model.tableView==='xl'?'standard':'xl';localStorage.setItem(TABLE_VIEW_KEY,model.tableView);render();}
 else if(act==='choose-local'){model.localPlayers=Number(b.dataset.n);render();}
 else if(act==='start-solo')startLocal('solo');
 else if(act==='start-local')startLocal('local');
 else if(act==='resume'){try{const x=JSON.parse(localStorage.getItem(LOCAL_KEY));model.mode=x.mode;model.game=hydrateGame(x.game);model.screen='game';model.cover=x.mode==='local';model.undoStack=[];model.actionBusy=false;resetSelection();render();scheduleBots();}catch{notify('تعذر استئناف اللعبة');}}
 else if(act==='rules'){model.gameMenuOpen=false;model.dialog='rules';render();}
 else if(act==='settings'){model.gameMenuOpen=false;model.dialog='settings';model.notice='';render();}
 else if(act==='close-dialog'){model.dialog=null;render();}
 else if(act==='save-config'){const raw=safeText($('#firebaseConfig')?.value);try{const cfg=JSON.parse(raw);model.notice='';await connectFirebase(cfg);localStorage.setItem('shayeb_firebase_config',JSON.stringify(cfg));model.dialog=null;notify('تم تفعيل الاتصال');render();}catch(e){model.notice='تحقق من الإعدادات: '+e.message;render();}}
 else if(act==='create-room')await createRoom();
 else if(act==='join-room')await joinRoom();
 else if(act==='start-room')await startRoom();
 else if(act==='copy-code'){try{await navigator.clipboard.writeText(model.roomCode);notify('نُسخ الرمز: '+model.roomCode);}catch{notify('رمز الغرفة: '+model.roomCode);}}
 else if(act==='share-room')await shareRoom();
 else if(act==='leave-room')await leaveRoom();
 else if(act==='inspect-pile'){model.inspectPile=Number(b.dataset.i);render();}
 else if(act==='close-inspect'){model.inspectPile=null;render();}
 else if(act==='use-inspect'){const i=model.inspectPile;model.inspectPile=null;if(isMyTurn()&&model.game.turnDrawn){model.selected={kind:'pile',index:i};model.hint=false;}render();}
 else if(act==='hand')selectedCard(b.dataset.card);
 else if(act==='pile')selectedPile(Number(b.dataset.i));
 else if(act==='draw'){if(!isMyTurn())return;model.mode==='online'?await onlineAction({type:'draw'}):await performLocalAction({type:'draw'});}
 else if(act==='end'){if(!isMyTurn())return;let mode=model.mode;let passed=model.game.turn;if(mode==='online')await onlineAction({type:'end'});else{if(applyLocal({type:'end'})&&mode==='local'&&model.game?.phase==='playing'){model.cover=true;render();}}}
 else if(act==='uncover'){model.cover=false;render();}
 else if(act==='clear'){resetSelection();render();}
 else if(act==='hint')makeHint();
 else if(act==='restart'){model.gameMenuOpen=false;if(!['finished','matchFinished'].includes(model.game?.phase)){if(!confirm('بدء مباراة جديدة سيلغي الجولات السابقة والنقاط التراكمية. هل أنت متأكد؟'))return;if(model.mode==='online'){notify('لا يمكن إعادة المباراة أثناء اللعب الجماعي');return;}}await restart();}
 }catch(e){notify(e.message||'حدث خطأ غير متوقع');console.error(e);}
});

appRoot.addEventListener('change',e=>{if(e.target?.id==='matchRoundsInput'){const n=Number(e.target.value);if(!Number.isInteger(n)||n<1||n>30){notify('اختر من ١ إلى ٣٠ جولة');e.target.value=model.matchRounds;return;}model.matchRounds=n;localStorage.setItem(ROUNDS_KEY,String(n));render();}});

// A hold-to-enlarge preview; it is deliberately noninteractive and disappears at release.
let peekGesture=null,peekTimer=null,peekVisible=false;
function closePeek(){if(peekTimer!==null){clearTimeout(peekTimer);peekTimer=null;}document.querySelector('.peek-overlay')?.remove();peekVisible=false;}
function previewCodeFromTarget(target){return target.closest('.hand-card .card[data-code],.play-board .card[data-code],.board-token[data-card-code]')?.dataset.code||target.closest('.board-token[data-card-code]')?.dataset.cardCode||null;}
function showPeek(code){
 if(!code||!model.game||model.screen!=='game')return;
 closePeek();peekVisible=true;
 const el=document.createElement('div');el.className='peek-overlay';el.setAttribute('aria-label','تكبير الورقة '+pretty(code));
 el.innerHTML=`<div class="peek-content">${cardHTML(code,'inspection')}<strong dir="ltr">${pretty(code)}</strong><span>حرّر إصبعك للعودة إلى الطاولة</span></div>`;
 document.body.appendChild(el);
}
appRoot.addEventListener('pointerdown',e=>{
 if(e.button!==undefined&&e.button!==0)return;
 const code=previewCodeFromTarget(e.target);
 if(!code||model.screen!=='game'||model.gameMenuOpen||model.dialog||model.inspectPile!==null)return;
 peekGesture={pointer:e.pointerId,x:e.clientX,y:e.clientY,source:e.target.closest('[data-action]')||e.target,code,fired:false};
 peekTimer=setTimeout(()=>{
   const g=peekGesture;if(!g||g.pointer!==e.pointerId)return;
   g.fired=true;showPeek(g.code);
 },480);
},true);
appRoot.addEventListener('pointermove',e=>{const g=peekGesture;if(g?.pointer!==e.pointerId)return;if(Math.hypot(e.clientX-g.x,e.clientY-g.y)>9){if(peekTimer!==null){clearTimeout(peekTimer);peekTimer=null;}if(peekVisible)closePeek();}},true);
function stopPeek(e){const g=peekGesture;if(!g||g.pointer!==e.pointerId)return;peekGesture=null;
 if(g.fired)suppressDraggedClick={source:g.source,until:performance.now()+550};
 closePeek();}
appRoot.addEventListener('pointerup',stopPeek,true);
appRoot.addEventListener('pointercancel',stopPeek,true);
// Touch and mouse drag: tap-to-select remains available. Both gestures use the same game rules.
let gesture=null;
let suppressDraggedClick=null;
appRoot.addEventListener('click',e=>{
 if(suppressDraggedClick && performance.now()<suppressDraggedClick.until && e.composedPath().includes(suppressDraggedClick.source)){e.preventDefault();e.stopImmediatePropagation();suppressDraggedClick=null;}
},true);
function dragTargets(g){
 const s=model.game;
 if(!s)return[];
 if(g.kind==='hand')return Array.from({length:8},(_,i)=>i).filter(i=>canPlace(g.card,s.piles[i],i));
 return Array.from({length:8},(_,i)=>i).filter(i=>canMove(s.piles,g.from,i));
}
function dragClean(){
 document.documentElement.classList.remove('drag-in-progress');
 document.querySelectorAll('.drag-valid,.drag-hover').forEach(e=>e.classList.remove('drag-valid','drag-hover'));
 document.querySelector('.drag-ghost')?.remove();
}
function dragMove(e){
 const g=gesture;
 if(!g||e.pointerId!==g.pointer)return;
 const distance=Math.hypot(e.clientX-g.startX,e.clientY-g.startY);
 if(!g.moved && distance<10)return;
 if(!g.moved){
   g.moved=true;
   document.documentElement.classList.add('drag-in-progress');
   const ghost=document.createElement('div'); ghost.className='drag-ghost';
   ghost.innerHTML=g.kind==='hand'?cardHTML(g.card):cardHTML(model.game.piles[g.from][0]);
   document.body.appendChild(ghost);g.ghost=ghost;
   g.valid=dragTargets(g);
   document.querySelectorAll('.play-board .pile').forEach(p=>{    if(g.valid.includes(Number(p.dataset.i)))p.classList.add('drag-valid');
   });
 }
 e.preventDefault();
 if(g.ghost){g.ghost.style.left=e.clientX+'px';g.ghost.style.top=e.clientY+'px';}
 document.querySelectorAll('.pile.drag-hover').forEach(el=>el.classList.remove('drag-hover'));
 const at=document.elementFromPoint(e.clientX,e.clientY)?.closest('.play-board .pile');
 g.target=at&&g.valid.includes(Number(at.dataset.i))?Number(at.dataset.i):null;
 if(g.target!==null)at.classList.add('drag-hover');
}
appRoot.addEventListener('pointerdown',e=>{
 if(model.actionBusy||!isMyTurn()||!model.game?.turnDrawn||model.dialog||model.inspectPile!==null||model.gameMenuOpen)return;
 if(e.button!==undefined&&e.button!==0)return;
 const hand=e.target.closest('.play-bottom .hand-card[data-card]');
 const pile=e.target.closest('.play-board .pile[data-i]');
 if(!hand&&!pile)return;
 if(hand?.disabled)return;
 if(pile&&!model.game.piles[Number(pile.dataset.i)]?.length)return;
 const kind=hand?'hand':'pile';
 gesture={pointer:e.pointerId,startX:e.clientX,startY:e.clientY,moved:false,target:null,valid:[],kind,source:hand||pile,card:hand?.dataset.card,from:pile?Number(pile.dataset.i):null};
 const captureTarget=hand||pile;
 if(captureTarget?.setPointerCapture){try{captureTarget.setPointerCapture(e.pointerId)}catch{}}
});
appRoot.addEventListener('pointermove',dragMove,{passive:false});
appRoot.addEventListener('pointerup',e=>{
 const g=gesture;
 if(!g||g.pointer!==e.pointerId)return;
 gesture=null;
 if(!g.moved){dragClean();return;}
 e.preventDefault();
 suppressDraggedClick={source:g.source,until:performance.now()+500};
 const target=g.target;
 dragClean();
 if(target===null){notify('أفلت الورقة فوق إحدى الخانات المضيئة');return;}
 const action=g.kind==='hand'?{type:'play',card:g.card,to:target}:{type:'move',from:g.from,to:target};
 if(model.mode==='online')onlineAction(action);else performLocalAction(action,{x:e.clientX,y:e.clientY});
});
appRoot.addEventListener('pointercancel',()=>{gesture=null;dragClean();});

// Only local play is available until a shared Firebase configuration is connected.
render();connectIfReady();

</script>
